<style id="gate-style">html:not(.unlocked) body>*:not(#gate){display:none!important}#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;font-family:system-ui,sans-serif}#gate form{display:flex;gap:8px}#gate input{padding:10px 14px;font-size:16px;border-radius:6px;border:1px solid #444;background:#222;color:#fff}#gate button{padding:10px 16px;font-size:16px;border-radius:6px;border:0;background:#fff;cursor:pointer}</style>
<script>
(function(){
  var H="973d0c649aa97a0635e387399f32c49abdaa7b2e812a65812255d1ed863b1604";
  function unlock(){document.documentElement.classList.add("unlocked");var g=document.getElementById("gate");if(g)g.remove();}
  async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");}
  try{if(sessionStorage.getItem("ok")===H){document.documentElement.classList.add("unlocked");return;}}catch(e){}
  document.addEventListener("DOMContentLoaded",function(){
    var d=document.createElement("div");d.id="gate";
    d.innerHTML='<form><input type="password" placeholder="Password" autofocus><button>Enter</button></form>';
    document.body.appendChild(d);
    d.querySelector("form").addEventListener("submit",async function(e){
      e.preventDefault();var v=d.querySelector("input").value;
      if(await sha(v)===H){try{sessionStorage.setItem("ok",H)}catch(e){}unlock();}
      else{d.querySelector("input").value="";d.querySelector("input").placeholder="Wrong password";}
    });
  });
})();
</script>
